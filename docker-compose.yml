name: solver

networks:
  solver_net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solver_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - solver_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: solver-backend:latest
    restart: unless-stopped
    # The app logs in as `solver_runtime`, not the owner (migration 0037):
    # `.env.runtime`, written by scripts/runtime_role.sh, overrides .env's
    # DATABASE_URL. Without it the owner's URL from .env is used, as before.
    # Migrations -- `compose run backend alembic ...` -- run as the owner.
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      MIGRATION_DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_HOST: clickhouse
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - solver_net

  # Solving runs here, not in a web request: a model may take longer than a
  # request should, and a solve would otherwise hold a web worker for its
  # duration. Several replicas are safe -- the queue is claimed with
  # FOR UPDATE SKIP LOCKED.
  #
  # It shares the api's image deliberately. With two image names, a build
  # of one left the other serving older code, and the only symptom was a
  # run quietly solved by the wrong solver.
  worker:
    build: ./backend
    image: solver-backend:latest
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      MIGRATION_DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_HOST: clickhouse
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solver_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - solver_net
