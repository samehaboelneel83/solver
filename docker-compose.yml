name: solver

networks:
  solver_net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:

services:
  postgres:
    # PostGIS: Postgres 16 with the spatial extension (map data, migration 0097). The
    # same data directory as postgres:16; without the extension the platform still runs.
    # Keep the database OS/libc stable: changing its collation library requires
    # reindexing every database before refreshing stored collation versions.
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    pull_policy: never
    restart: unless-stopped
    # R39: nightly dumps + WAL land under SOLVER_BACKUP_DIR on the host
    # (default: sibling solver-backups/). archive_mode needs a restart once.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=mkdir -p /backups/wal && test ! -f /backups/wal/%f && cp %p /backups/wal/%f
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${SOLVER_BACKUP_DIR:-../solver-backups}:/backups
    networks:
      - solver_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - solver_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: solver-backend:latest
    restart: unless-stopped
    # The app logs in as `solver_runtime`, not the owner (migration 0037):
    # `.env.runtime`, written by scripts/runtime_role.sh, overrides .env's
    # DATABASE_URL. Without it the owner's URL from .env is used, as before.
    # Migrations -- `compose run backend alembic ...` -- run as the owner.
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      MIGRATION_DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_HOST: clickhouse
      # Solvers added from a manifest (queue R41, docs/solver-adapters.md): the reference
      # adapters shipped in the image, then a customer's own, mounted at /opt/solver/adapters.
      # The api and the worker must read the same folders.
      SOLVER_ADAPTERS_DIR: ${SOLVER_ADAPTERS_DIR:-/app/adapters/reference:/opt/solver/adapters}
      # OAAS OPS01: LATEST manifest + dump list for the Backups page.
      SOLVER_BACKUP_DIR: /backups
      # The Assistant (docs/assistant.md): your vLLM server, reached from this container.
      AGENT_ENABLED: ${AGENT_ENABLED:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://10.125.18.189:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_CONTEXT: ${LLM_CONTEXT:-262144}
      LLM_COMPACT_AT: ${LLM_COMPACT_AT:-0.6}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-16384}
      LLM_PLAN_MAX_TOKENS: ${LLM_PLAN_MAX_TOKENS:-32768}
      LLM_THINKING: ${LLM_THINKING:-off}
      LLM_WORKING_TOKENS: ${LLM_WORKING_TOKENS:-48000}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-1800}
      LLM_TOOL_MODE: ${LLM_TOOL_MODE:-auto}
      AGENT_CONFIRM: ${AGENT_CONFIRM:-delete}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-60}
      # Model-written Python can escape Python-level network guards; enable only after
      # reviewing the sandbox and applying a network policy (docs/assistant.md).
      AGENT_RUN_PYTHON: ${AGENT_RUN_PYTHON:-0}
    ports:
      - "8010:8000"
    # Prometheus metrics (app/core/metrics.py): on the compose network only,
    # never published -- queue depth names organizations.
    expose:
      - "9101"
    volumes:
      - ${SOLVER_BACKUP_DIR:-../solver-backups}:/backups:ro
    # Solving happens in the worker; the API only answers requests.
    mem_limit: 2g
    cpus: "4"
    depends_on:
      postgres:
        condition: service_healthy
      # ClickHouse is optional for planning (OAAS S01): analytics may degrade
      # while the API still serves. Health reports clickhouse separately.
      clickhouse:
        condition: service_started
    networks:
      - solver_net

  # Solving runs here, not in a web request: a model may take longer than a
  # request should, and a solve would otherwise hold a web worker for its
  # duration. Several replicas are safe -- the queue is claimed with
  # FOR UPDATE SKIP LOCKED.
  #
  # It shares the api's image deliberately. With two image names, a build
  # of one left the other serving older code, and the only symptom was a
  # run quietly solved by the wrong solver.
  worker:
    build: ./backend
    image: solver-backend:latest
    restart: unless-stopped
    env_file:
      - .env
      - path: .env.runtime
        required: false
    environment:
      MIGRATION_DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_HOST: clickhouse
      # Address space each solve may use (app.solve.sandbox).
      SOLVE_MEMORY_MB: ${SOLVE_MEMORY_MB:-4096}
      SOLVE_WORKER_CPUS: ${SOLVE_WORKER_CPUS:-8}
      SOLVE_HOST_WORKERS: ${SOLVE_HOST_WORKERS:-8}
      SOLVE_HOST_MEMORY_MB: ${SOLVE_HOST_MEMORY_MB:-10240}
      # Threads and memory long runs leave free so short runs (what-ifs, trials, quick plans) start at once;
      # 0 = no reserve. A run is short when its time limit is at most SOLVE_SHORT_SECONDS (app.solve.reserve).
      SOLVE_SHORT_SHARE: ${SOLVE_SHORT_SHARE:-0}
      SOLVE_SHORT_SECONDS: ${SOLVE_SHORT_SECONDS:-60}
      # A long run that waited this long for room is not passed by other long runs.
      SOLVE_STARVE_SECONDS: ${SOLVE_STARVE_SECONDS:-900}
      # As the api's: the same added solvers (queue R41).
      SOLVER_ADAPTERS_DIR: ${SOLVER_ADAPTERS_DIR:-/app/adapters/reference:/opt/solver/adapters}
    command: ["python", "-m", "app.worker"]
    # Prometheus metrics, on the compose network only.
    expose:
      - "9100"
    # The container's ceiling (Phase 9). Each solve also runs in a child with
    # its own: SOLVE_MEMORY_MB of address space (default 4096) and CPU time
    # of its time limit x workers + 30 s (app.solve.sandbox). The worker
    # itself stays small, so a solve that hits either fails alone.
    mem_limit: ${SOLVE_WORKER_MEMORY:-12g}
    cpus: "${SOLVE_WORKER_CPUS:-8}"
    # How many solve workers run side by side: the queue hands each run to exactly one, and the host
    # reservation (SOLVE_HOST_WORKERS / SOLVE_HOST_MEMORY_MB) keeps their sum within the machine.
    deploy:
      replicas: ${SOLVE_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solver_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - solver_net
