<!-- @dsCard group="Components" viewport="1180x720" name="AppBar & MCAIT widget" subtitle="Standard product top bar + the shared MCAIT identity cluster (seal · Cowork · product selector · account)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--mc-canvas);padding:24px;font-family:var(--font-sans);color:var(--mc-ink);}
  .label{font-size:10px;font-family:var(--font-mono);color:var(--mc-faint);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px 2px;}
  .frame{border:1px solid var(--mc-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:24px;}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { AppBar, MCAITWidget } = window.MCAITDesignSystem_6bac07;

function SearchField({ placeholder }) {
  return (
    <div style={{ flex:1, maxWidth:460, display:'flex', alignItems:'center', gap:8, background:'var(--mc-canvas-2)', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-sm)', padding:'0 14px', height:36 }}>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mc-faint)" strokeWidth="1.5" strokeLinecap="round"><path d="M21 21l-6-6"/><circle cx="10" cy="10" r="7"/></svg>
      <input placeholder={placeholder} style={{ flex:1, border:'none', outline:'none', background:'transparent', fontSize:13, color:'var(--mc-ink)', fontFamily:'var(--font-sans)' }} />
    </div>
  );
}

function Demo() {
  return (
    <div>
      <div className="label">AppBar · Drive (blue accent)</div>
      <div className="frame">
        <AppBar product={{ id:'drive', name:'Drive', icon:'folder' }} onNavigate={()=>{}}>
          <SearchField placeholder="What do you want to find?" />
        </AppBar>
      </div>

      <div className="label">AppBar · Calendar (green accent)</div>
      <div className="frame">
        <AppBar product={{ id:'calendar', name:'Calendar', icon:'calendar' }} onNavigate={()=>{}}>
          <SearchField placeholder="Search events and people" />
        </AppBar>
      </div>

      <div className="label">AppBar · Cowork (gold — the flagship hub)</div>
      <div className="frame">
        <AppBar product={{ id:'cowork', name:'Cowork', icon:'sparkle' }} onNavigate={()=>{}}>
          <SearchField placeholder="Ask or search across your workspace" />
        </AppBar>
      </div>

      <div className="label">MCAIT identity widget · anatomy</div>
      <div style={{ display:'flex', gap:24, alignItems:'flex-start', flexWrap:'wrap', padding:'18px 18px', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-lg)', background:'var(--mc-surface)' }}>
        <div style={{ flexShrink:0 }}><MCAITWidget activeApp="drive" onNavigate={()=>{}} /></div>
        <div style={{ flex:1, minWidth:240, display:'flex', flexDirection:'column', gap:10 }}>
          {[
            ['M8 seal','The constant gold brand mark — anchors the cluster and signals you are inside the MCAIT platform.'],
            ['Cowork','Opens the agentic assistant inline, from any product.'],
            ['Apps / product selector','CORE: the 3-column grid that switches between every MCAIT product (Drive, Calendar, Meet, Notebook, Mail, Aura). This is what makes the suite feel like one account — one click moves you across the whole family. The current product is highlighted in its accent.'],
            ['Account','The signed-in user menu — profile, settings, privacy, sign out.'],
          ].map(([t,d]) => (
            <div key={t} style={{ display:'flex', gap:10, alignItems:'baseline' }}>
              <span style={{ flexShrink:0, width:150, fontSize:12, fontWeight:600, color:'var(--mc-ink)' }}>{t}</span>
              <span style={{ fontSize:12.5, lineHeight:1.5, color:'var(--mc-muted)' }}>{d}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
