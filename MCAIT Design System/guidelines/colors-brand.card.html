<!-- @dsCard group="Colors" viewport="700x180" name="Brand Gold" subtitle="MCAIT signature color — used sparingly for brand moments" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--mc-canvas); display: flex; align-items: center; padding: 20px 24px; gap: 12px; font-family: var(--font-sans); }
  .swatch { width: 64px; height: 64px; border-radius: var(--radius-md); flex-shrink: 0; }
  .info { display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--mc-ink); }
  .token { font-size: var(--text-xs); font-family: var(--font-mono); color: var(--mc-muted); }
  .group { display: flex; gap: 8px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
</style>
</head><body>
<div class="group">
  <div class="col"><div class="swatch" style="background:var(--mc-gold)"></div><div class="info"><div class="name">Gold</div><div class="token">--mc-gold</div></div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-gold-hover)"></div><div class="info"><div class="name">Hover</div><div class="token">--mc-gold-hover</div></div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-gold-soft)"></div><div class="info"><div class="name">Soft</div><div class="token">--mc-gold-soft</div></div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-gold-line); border: 1px solid var(--mc-border)"></div><div class="info"><div class="name">Line</div><div class="token">--mc-gold-line</div></div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-gold-ink)"></div><div class="info"><div class="name">Ink</div><div class="token">--mc-gold-ink</div></div></div>
</div>
</body></html>
