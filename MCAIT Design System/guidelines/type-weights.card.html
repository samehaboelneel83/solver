<!-- @dsCard group="Type" viewport="700x160" name="Type Weights" subtitle="Weight tokens for Manrope" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--mc-surface); padding: 20px 24px; display: flex; gap: 0; font-family: var(--font-sans); }
  .col { flex: 1; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--mc-border-2); padding: 0 20px; }
  .col:first-child { padding-left: 0; }
  .col:last-child { border-right: none; }
  .token { font-size: 10px; font-family: var(--font-mono); color: var(--mc-faint); }
  .sample { font-size: var(--text-xl); color: var(--mc-ink); }
  .use { font-size: var(--text-xs); color: var(--mc-muted); }
</style>
</head><body>
  <div class="col"><div class="token">--weight-regular · 400</div><div class="sample" style="font-weight:400">Regular</div><div class="use">Long body, descriptions</div></div>
  <div class="col"><div class="token">--weight-medium · 500</div><div class="sample" style="font-weight:500">Medium</div><div class="use">Default UI, nav items</div></div>
  <div class="col"><div class="token">--weight-semibold · 600</div><div class="sample" style="font-weight:600">Semibold</div><div class="use">Headings, labels, buttons</div></div>
  <div class="col"><div class="token">--weight-bold · 700</div><div class="sample" style="font-weight:700">Bold</div><div class="use">Display, brand marks</div></div>
</body></html>
