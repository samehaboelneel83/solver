<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base scale — 8 steps" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--mc-surface); padding: 24px; display: flex; align-items: flex-end; gap: 16px; font-family: var(--font-sans); }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--mc-accent); border-radius: 4px; width: 32px; }
  .token { font-size: 9px; font-family: var(--font-mono); color: var(--mc-muted); text-align: center; }
  .px { font-size: 10px; font-weight: 600; color: var(--mc-ink-soft); text-align: center; }
</style>
</head><body data-product="cowork">
  <div class="col"><div class="bar" style="height:4px"></div><div class="px">4</div><div class="token">--space-1</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="px">8</div><div class="token">--space-2</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="px">12</div><div class="token">--space-3</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="px">16</div><div class="token">--space-4</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="px">24</div><div class="token">--space-5</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="px">32</div><div class="token">--space-6</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="px">48</div><div class="token">--space-7</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="px">64</div><div class="token">--space-8</div></div>
</body></html>
