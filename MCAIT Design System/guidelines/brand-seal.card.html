<!-- @dsCard group="Brand" viewport="700x200" name="Brand Seal" subtitle="MCAIT wordmark + gold seal — the constant brand signature" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--mc-canvas); padding: 24px; display: flex; align-items: center; gap: 40px; font-family: var(--font-sans); }
  .seal { width: 80px; height: 80px; border-radius: 20px; background: var(--mc-gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .seal-text { font-family: var(--font-display); font-size: 28px; font-weight: 800; color: var(--mc-gold-fg); letter-spacing: -0.04em; }
  .wordmark { font-family: var(--font-display); font-size: 36px; font-weight: 700; color: var(--mc-ink); letter-spacing: -0.03em; }
  .wordmark span { color: var(--mc-gold); }
  .tagline { font-size: var(--text-sm); color: var(--mc-muted); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
  .divider { width: 1px; height: 80px; background: var(--mc-border); }
  .small-seals { display: flex; gap: 10px; align-items: center; }
  .seal-sm { border-radius: 12px; background: var(--mc-gold); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; color: var(--mc-gold-fg); flex-shrink: 0; }
</style>
</head><body>
  <div class="seal"><span class="seal-text">M8</span></div>
  <div>
    <div class="wordmark">MC<span>AI</span>T</div>
    <div class="tagline">Agentic Workspace Platform</div>
  </div>
  <div class="divider"></div>
  <div class="small-seals">
    <div class="seal-sm" style="width:48px;height:48px;font-size:16px;border-radius:12px">M8</div>
    <div class="seal-sm" style="width:36px;height:36px;font-size:12px;border-radius:8px">M8</div>
    <div class="seal-sm" style="width:24px;height:24px;font-size:8px;border-radius:6px">M8</div>
  </div>
</body></html>
