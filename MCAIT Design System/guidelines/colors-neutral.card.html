<!-- @dsCard group="Colors" viewport="700x180" name="Neutral Scale" subtitle="Cool-slate neutrals shared by every product" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--mc-canvas); display: flex; align-items: center; padding: 20px 24px; gap: 8px; font-family: var(--font-sans); }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch { width: 54px; height: 54px; border-radius: var(--radius-sm); border: 1px solid var(--mc-border); flex-shrink: 0; }
  .name { font-size: 10px; font-weight: var(--weight-semibold); color: var(--mc-muted); text-align: center; }
  .token { font-size: 9px; font-family: var(--font-mono); color: var(--mc-faint); text-align: center; }
</style>
</head><body>
  <div class="col"><div class="swatch" style="background:var(--mc-ink)"></div><div class="name">Ink</div><div class="token">--mc-ink</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-ink-soft)"></div><div class="name">Ink Soft</div><div class="token">--mc-ink-soft</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-muted)"></div><div class="name">Muted</div><div class="token">--mc-muted</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-faint)"></div><div class="name">Faint</div><div class="token">--mc-faint</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-border-strong)"></div><div class="name">Border+</div><div class="token">--mc-border-strong</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-border)"></div><div class="name">Border</div><div class="token">--mc-border</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-canvas-2)"></div><div class="name">Canvas 2</div><div class="token">--mc-canvas-2</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-canvas)"></div><div class="name">Canvas</div><div class="token">--mc-canvas</div></div>
  <div class="col"><div class="swatch" style="background:var(--mc-surface)"></div><div class="name">Surface</div><div class="token">--mc-surface</div></div>
</body></html>
