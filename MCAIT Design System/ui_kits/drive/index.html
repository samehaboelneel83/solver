  { id:'cowork',   name:'Cowork',   color:'var(--mc-gold)',       icon:'sparkle', iconColor:'oklch(0.20 0.04 80)' },

function MiniAvatar({ name='', size=28 }) {
  const initials = name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  return <span style={{ width:size, height:size, borderRadius:'50%', background:'oklch(0.88 0.09 80)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:size*0.4, fontWeight:700, color:'oklch(0.32 0.08 80)', userSelect:'none' }}>{initials}</span>;
}

function MCAITWidget({ activeApp='drive' }) {
  const [open, setOpen] = React.useState(null);
  const toggle = k => setOpen(o => o===k ? null : k);
  const close = () => setOpen(null);
  const user = { name:'Omar Al-Amin', email:'omar@mcait.com' };
  const iconBtn = (key, child, title, activeBg) => (
    <button title={title} onClick={()=>toggle(key)} style={{ width:32, height:32, borderRadius:8, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', background: open===key ? (activeBg||'var(--mc-canvas-2)') : 'none' }}
      onMouseEnter={e=>{ if(open!==key) e.currentTarget.style.background = activeBg||'var(--mc-canvas-2)'; }} onMouseLeave={e=>{ if(open!==key) e.currentTarget.style.background='none'; }}>{child}</button>
  );
  return (
    <div style={{ position:'relative', display:'flex', alignItems:'center', gap:2, background:'var(--mc-canvas)', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-md)', padding:'4px 6px', flexShrink:0, boxShadow:'var(--shadow-sm)' }}>
      {open && <div style={{ position:'fixed', inset:0, zIndex:299 }} onClick={close} />}
      <div style={{ width:29, height:32, borderRadius:8, background:'var(--mc-gold)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <span style={{ fontFamily:'var(--font-display)', fontWeight:800, color:'oklch(0.20 0.04 80)', letterSpacing:'0.5px', lineHeight:1.05, display:'flex', flexDirection:'column', alignItems:'center' }}><span style={{ fontSize:8 }}>Mc</span><span style={{ fontSize:10 }}>8</span></span>
      </div>
      <div style={{ width:1, height:18, background:'var(--mc-border)', margin:'0 2px', flexShrink:0 }} />
      {iconBtn('cowork', <Icon name="sparkle" size={17} color="var(--mc-gold)" />, 'Cowork', 'var(--mc-gold-soft)')}
      {open==='cowork' && (
        <div style={{ position:'absolute', top:'100%', right:0, marginTop:8, zIndex:300, width:320, background:'var(--mc-surface)', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-lg)', overflow:'hidden' }}>
          <div style={{ padding:'14px 16px', borderBottom:'1px solid var(--mc-border)', display:'flex', alignItems:'center', gap:10, background:'var(--mc-gold-soft)' }}>
            <div style={{ width:28, height:28, borderRadius:7, background:'var(--mc-gold)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><Icon name="sparkle" size={14} color="oklch(0.20 0.04 80)" /></div>
            <div style={{ flex:1 }}><div style={{ fontFamily:'var(--font-display)', fontWeight:700, fontSize:14, color:'var(--mc-gold-ink)' }}>Cowork</div><div style={{ fontSize:10, color:'var(--mc-muted)' }}>Your agentic workspace assistant</div></div>
            <button onClick={close} style={{ background:'none', border:'none', cursor:'pointer', padding:4, display:'flex' }}><Icon name="x" size={14} color="var(--mc-faint)" /></button>
          </div>
          <div style={{ padding:'10px 12px', display:'flex', gap:8, alignItems:'center' }}>
            <input placeholder="Ask Cowork anything\u2026" style={{ flex:1, border:'1px solid var(--mc-border)', borderRadius:'var(--radius-sm)', padding:'8px 12px', fontSize:13, fontFamily:'var(--font-sans)', outline:'none', background:'var(--mc-canvas-2)', caretColor:'var(--mc-gold)' }} />
            <button style={{ width:34, height:34, borderRadius:'var(--radius-sm)', background:'var(--mc-gold)', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><Icon name="chevronRight" size={15} color="oklch(0.20 0.04 80)" strokeWidth={2} /></button>
          </div>
        </div>
      )}
      {iconBtn('apps', <Icon name="grid" size={17} color="var(--mc-faint)" />, 'MCAIT apps')}
      {open==='apps' && (
        <div style={{ position:'absolute', top:'100%', right:0, marginTop:8, zIndex:300, width:276, background:'var(--mc-surface)', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-lg)', padding:16 }}>
          <div style={{ fontSize:10, fontWeight:600, color:'var(--mc-muted)', letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:12 }}>MCAIT workspace</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:2 }}>
            {MCAIT_APPS.map(app => (
              <button key={app.id} onClick={close} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:5, padding:'8px 4px', borderRadius:'var(--radius-md)', background:'none', border:'none', cursor:'pointer' }}
                onMouseEnter={e=>e.currentTarget.style.background='var(--mc-canvas-2)'} onMouseLeave={e=>e.currentTarget.style.background='none'}>
                <div style={{ width:36, height:36, borderRadius:9, background:app.color, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'var(--shadow-sm)' }}><Icon name={app.icon} size={18} color={app.iconColor||'#fff'} strokeWidth={1.5} /></div>
                <span style={{ fontSize:11, fontWeight: app.id===activeApp ? 600 : 400, color: app.id===activeApp ? 'var(--mc-accent)' : 'var(--mc-ink-soft)' }}>{app.name}</span>
              </button>
            ))}
          </div>
        </div>
      )}
      <button onClick={()=>toggle('user')} style={{ background:'none', border:'none', cursor:'pointer', borderRadius:'50%', padding:2, display:'flex' }}><MiniAvatar name={user.name} size={28} /></button>
      {open==='user' && (
        <div style={{ position:'absolute', top:'100%', right:0, marginTop:8, zIndex:300, width:264, background:'var(--mc-surface)', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-lg)', overflow:'hidden' }}>
          <div style={{ padding:20, display:'flex', flexDirection:'column', alignItems:'center', gap:10, borderBottom:'1px solid var(--mc-border)', background:'var(--mc-canvas)' }}>
            <MiniAvatar name={user.name} size={60} />
            <div style={{ textAlign:'center' }}><div style={{ fontSize:15, fontWeight:600, color:'var(--mc-ink)' }}>{user.name}</div><div style={{ fontSize:12, color:'var(--mc-muted)', fontFamily:'var(--font-mono)', marginTop:2 }}>{user.email}</div></div>
          </div>
          {[{label:'Manage your account',icon:'settings'},{label:'Settings & preferences',icon:'settings'},{label:'Privacy & terms',icon:'info'}].map(({label,icon})=>(
            <button key={label} style={{ width:'100%', display:'flex', alignItems:'center', gap:10, padding:'10px 16px', background:'none', border:'none', cursor:'pointer', fontSize:13, fontFamily:'var(--font-sans)', color:'var(--mc-ink-soft)', textAlign:'left' }}
              onMouseEnter={e=>e.currentTarget.style.background='var(--mc-canvas-2)'} onMouseLeave={e=>e.currentTarget.style.background='none'}><Icon name={icon} size={15} color="var(--mc-faint)" />{label}</button>
          ))}
          <div style={{ height:1, background:'var(--mc-border)' }} />
          <button style={{ width:'100%', display:'flex', alignItems:'center', gap:10, padding:'10px 16px', background:'none', border:'none', cursor:'pointer', fontSize:13, fontFamily:'var(--font-sans)', color:'var(--mc-ink-soft)', textAlign:'left' }}
            onMouseEnter={e=>e.currentTarget.style.background='var(--mc-canvas-2)'} onMouseLeave={e=>e.currentTarget.style.background='none'}><Icon name="logout" size={15} color="var(--mc-faint)" />Sign out</button>
        </div>
      )}
    </div>
  );
}

/* ── top header (brand · search · identity) ── */
function HeaderBar({ search, setSearch }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:16, padding:'10px 20px', background:'var(--mc-surface)', flexShrink:0 }}>
      {/* Brand */}
      <div style={{ display:'flex', alignItems:'center', gap:9, flexShrink:0 }}>
        <div style={{ width:30, height:30, borderRadius:8, background:'var(--mc-accent)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <Icon name="folder" size={16} color="#fff" strokeWidth={1.75} />
        </div>
        <span style={{ fontFamily:'var(--font-display)', fontWeight:700, fontSize:18, letterSpacing:'-0.02em', color:'var(--mc-accent)' }}>Drive</span>
      </div>

      {/* Search */}
      <div style={{ flex:'1 1 auto', minWidth:0, maxWidth:560, display:'flex', alignItems:'center', gap:8, background:'var(--mc-canvas-2)', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-md)', padding:'0 14px', height:38 }}>
        <Icon name="search" size={15} color="var(--mc-faint)" />
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="What do you want to find?"

      <div style={{ marginLeft:'auto', flexShrink:0 }}>
        <MCAITWidget activeApp="drive" />
      </div>

}

/* ── toolbar ── */

  return (

      <div style={{ display:'flex', alignItems:'center', gap:4, fontSize:13, color:'var(--mc-muted)', fontWeight:500, flex:'0 1 auto', minWidth:0, overflow:'hidden' }}>
        <span style={{ color:'var(--mc-ink)', fontWeight:600, flexShrink:0 }}>My Drive</span>
        <Icon name="chevronRight" size={12} color="var(--mc-faint)" />
        <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>Q3 Reports</span>
      </div>

      <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
        {/* Sort */}

          <Icon name="list" size={12} color="var(--mc-faint)" />
          Name
          <Icon name="chevronRight" size={10} color="var(--mc-faint)" strokeWidth={2} />
        </button>

        {/* View toggle */}
        <div style={{ display:'flex', border:'1px solid var(--mc-border)', borderRadius:'var(--radius-sm)', overflow:'hidden' }}>

            <button key={v} onClick={() => setView(v)}
              style={{ width:30, height:30, display:'flex', alignItems:'center', justifyContent:'center', border:'none', cursor:'pointer', background: view===v ? 'var(--mc-accent-soft)' : 'var(--mc-canvas-2)', transition:'background .13s' }}>
              <Icon name={v} size={13} color={view===v ? 'var(--mc-accent)' : 'var(--mc-faint)'} />
            </button>
          ))}

        {/* Upload */}

/* ── file row ── */
function FileRow({ item, selected, onSelect }) {
  const [hovered, setHovered] = React.useState(false);
  const iconColor = FILE_COLORS[item.type] || 'var(--mc-faint)';
  const iconName = item.type === 'folder' ? 'folder' : item.type;
  const bg = selected ? 'var(--mc-accent-soft)' : hovered ? 'var(--mc-canvas-2)' : 'transparent';

  return (
    <tr onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ background:bg, cursor:'pointer', transition:'background .1s', borderBottom:'1px solid var(--mc-border-2)' }}>
      <td style={{ width:36, padding:'8px 0 8px 14px' }}>
        <div onClick={onSelect} style={{ width:16, height:16, borderRadius:4, border:`1.5px solid ${selected ? 'var(--mc-accent)' : 'var(--mc-border-strong)'}`, background: selected ? 'var(--mc-accent)' : 'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', transition:'all .12s' }}>
          {selected && <Icon name="check" size={10} color="#fff" strokeWidth={2.5} />}
        </div>
      </td>
      <td style={{ padding:'8px 10px 8px 4px', display:'flex', alignItems:'center', gap:9 }}>
        <Icon name={iconName} size={16} color={iconColor} strokeWidth={item.type==='folder'?1.75:1.4} />
        <span style={{ fontSize:13, fontWeight:500, color:'var(--mc-ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:260 }}>{item.name}</span>
        {item.starred && <Icon name="star" size={12} color="var(--mc-gold)" strokeWidth={1.5} />}
        {item.shared && <Icon name="users" size={12} color="var(--mc-faint)" strokeWidth={1.5} />}
      </td>
      <td style={{ padding:'8px 12px', fontSize:12, color:'var(--mc-muted)', fontFamily:'var(--font-mono)', whiteSpace:'nowrap' }}>{item.modified}</td>
      <td style={{ padding:'8px 12px', fontSize:12, color:'var(--mc-muted)', fontFamily:'var(--font-mono)' }}>{item.size}</td>
      <td style={{ padding:'8px 12px', fontSize:12, color:'var(--mc-muted)' }}>{item.owner}</td>
      <td style={{ padding:'8px 12px 8px 0', width:32 }}>
        {(hovered || selected) && (
          <button style={{ background:'none', border:'none', cursor:'pointer', color:'var(--mc-muted)', padding:'2px', display:'flex', alignItems:'center', borderRadius:4 }}>
            <Icon name="more" size={14} color="var(--mc-faint)" strokeWidth={2} />
          </button>
        )}
      </td>
    </tr>
  );
}

/* ── file card (grid view) ── */
function FileCard({ item, selected, onSelect }) {
  const [hovered, setHovered] = React.useState(false);
  const iconColor = FILE_COLORS[item.type] || 'var(--mc-faint)';
  const iconName = item.type === 'folder' ? 'folder' : item.type;

  return (
    <div onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ background:'var(--mc-surface)', border:`1px solid ${selected ? 'var(--mc-accent-line)' : hovered ? 'var(--mc-border-strong)' : 'var(--mc-border)'}`, borderRadius:'var(--radius-lg)', padding:'14px', cursor:'pointer', transition:'all .15s', boxShadow: hovered ? 'var(--shadow-md)' : 'var(--shadow-sm)', transform: hovered ? 'translateY(-1px)' : 'none', display:'flex', flexDirection:'column', gap:10, position:'relative' }}>
      {/* Checkbox */}
      <div onClick={e => { e.stopPropagation(); onSelect(); }}
        style={{ position:'absolute', top:10, left:10, width:16, height:16, borderRadius:4, border:`1.5px solid ${selected ? 'var(--mc-accent)' : 'var(--mc-border-strong)'}`, background: selected ? 'var(--mc-accent)' : 'white', display: selected || hovered ? 'flex' : 'none', alignItems:'center', justifyContent:'center', zIndex:1 }}>
        {selected && <Icon name="check" size={10} color="#fff" strokeWidth={2.5} />}
      </div>

      {/* Thumbnail */}
      <div style={{ height:80, borderRadius:'var(--radius-sm)', background: item.type==='folder' ? 'var(--mc-gold-soft)' : 'var(--mc-canvas-2)', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <Icon name={iconName} size={32} color={iconColor} strokeWidth={1.2} />
      </div>

      {/* Info */}
      <div>
        <div style={{ fontSize:12, fontWeight:600, color:'var(--mc-ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginBottom:2 }}>{item.name}</div>
        <div style={{ fontSize:10, color:'var(--mc-muted)', fontFamily:'var(--font-mono)' }}>{item.modified}</div>
      </div>
    </div>
  );
}

/* ── main app ── */
function App() {
  const [navActive, setNavActive] = React.useState('my-drive');
  const [collapsed, setCollapsed] = React.useState(false);
  const [view, setView] = React.useState('list');
  const [search, setSearch] = React.useState('');
  const [selected, setSelected] = React.useState(new Set());

  const toggle = id => setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const filtered = ITEMS.filter(i => i.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', background:'var(--mc-surface)' }}>
      <HeaderBar search={search} setSearch={setSearch} />
      <div style={{ display:'flex', flex:1, overflow:'hidden', background:'var(--mc-surface)' }}>
        <Sidebar
          items={NAV_ITEMS}
          volume={DRIVE_VOLUME}
          active={navActive}
          onNavigate={setNavActive}
          collapsed={collapsed}
          onToggle={setCollapsed}
          roundedCorner="none"
          style={{ borderTop:'none', borderRight:'none' }}
        />
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--mc-canvas)', borderTop:'1px solid var(--mc-border)', borderLeft:'1px solid var(--mc-border)', borderTopLeftRadius:'var(--radius-lg)' }}>
          <Toolbar view={view} setView={setView} />

        {/* Selection bar */}
        {selected.size > 0 && (
          <div style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 20px', background:'var(--mc-accent-soft)', borderBottom:'1px solid var(--mc-accent-line)', fontSize:12, color:'var(--mc-accent-ink)', fontWeight:600 }}>
            <span>{selected.size} selected</span>
            {[['share','Share'],['trash','Move to trash'],['star','Star']].map(([ico,lbl]) => (
              <button key={ico} style={{ display:'flex', alignItems:'center', gap:5, padding:'4px 10px', borderRadius:'var(--radius-sm)', background:'var(--mc-surface)', border:'1px solid var(--mc-accent-line)', cursor:'pointer', fontSize:11, color:'var(--mc-accent-ink)', fontFamily:'var(--font-sans)', fontWeight:500 }}>
                <Icon name={ico} size={11} color="var(--mc-accent)" />
                {lbl}
              </button>
            ))}
            <button onClick={() => setSelected(new Set())} style={{ marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color:'var(--mc-muted)', fontSize:18, lineHeight:1 }}>×</button>
          </div>
        )}

        {/* Content */}
        <div style={{ flex:1, overflowY:'auto', padding: view==='grid' ? '20px' : '0 20px 20px' }}>
          {view === 'list' ? (
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead>
                <tr style={{ borderBottom:'1px solid var(--mc-border)' }}>
                  {['','Name','Modified','Size','Owner',''].map((h,i) => (
                    <th key={i} style={{ padding: i===1 ? '8px 10px 8px 4px' : '8px 12px', textAlign:'left', fontSize:11, fontWeight:600, color:'var(--mc-muted)', letterSpacing:'.04em', textTransform:'uppercase', whiteSpace:'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map(item => (
                  <FileRow key={item.id} item={item} selected={selected.has(item.id)} onSelect={() => toggle(item.id)} />
                ))}
              </tbody>
            </table>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:12 }}>
              {filtered.map(item => (
                <FileCard key={item.id} item={item} selected={selected.has(item.id)} onSelect={() => toggle(item.id)} />
              ))}
            </div>
          )}
        </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
