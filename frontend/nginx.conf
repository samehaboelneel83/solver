server {
    listen 80;

    # Docker's own DNS, re-asked every 10 seconds. With a plain
    # `proxy_pass http://backend:8000;` nginx looks `backend` up ONCE, at
    # start-up, and keeps that address for good. Recreating the backend alone
    # (a `docker compose up -d backend`) gives it a new address, the old one
    # is handed to another container, and every /api request is refused --
    # a 502 on every screen while the backend itself is perfectly healthy.
    # That happened on 2026-09-22, with the worker holding the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # A variable is what makes nginx resolve at request time rather than
        # at start-up. With no URI part, the request's own URI is passed on
        # unchanged, exactly as the literal form did.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
