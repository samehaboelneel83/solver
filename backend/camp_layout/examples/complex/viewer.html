<title>Camp Site Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a surveyor's site plan -- the map is the page, a narrow schedule beside it. */
:root {
  --paper: #f4f6f1; --sheet: #ffffff; --ink: #1b2521; --muted: #5a6962; --rule: #d9dfd8; --grid: #e4e9e2;
  --bed: #2c5b88; --medical: #8b3d68; --corridor: #d7a23d; --zone: #3a8a5c; --zone-max: #3a8a5c;
  --obstacle: #3a433f; --prohibited: #c2462c; --door: #dd7419; --path: #2c5b88; --placement: #8b3d68;
  --d1: #2c5b88; --d2: #c2462c; --d3: #3a8a5c; --d4: #8b3d68; --near: #cfe0ef; --far: #1d3f63;
  --ok: #2f7d4f; --bad: #b3261e; --focus: #dd7419;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121816; --sheet: #19211e; --ink: #e2eae5; --muted: #93a39b; --rule: #2b3632; --grid: #1f2926;
  --bed: #7fb2e3; --medical: #d88bb7; --corridor: #c7983a; --zone: #5cb884; --zone-max: #5cb884;
  --obstacle: #8f9a95; --prohibited: #e37a5e; --door: #f29a48; --path: #7fb2e3; --placement: #d88bb7;
  --d1: #7fb2e3; --d2: #e37a5e; --d3: #5cb884; --d4: #d88bb7; --near: #2a4058; --far: #a9d0f5;
  --ok: #5cc486; --bad: #ff7a70; --focus: #f29a48; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121816; --sheet: #19211e; --ink: #e2eae5; --muted: #93a39b; --rule: #2b3632; --grid: #1f2926;
  --bed: #7fb2e3; --medical: #d88bb7; --corridor: #c7983a; --zone: #5cb884; --zone-max: #5cb884;
  --obstacle: #8f9a95; --prohibited: #e37a5e; --door: #f29a48; --path: #7fb2e3; --placement: #d88bb7;
  --d1: #7fb2e3; --d2: #e37a5e; --d3: #5cb884; --d4: #d88bb7; --near: #2a4058; --far: #a9d0f5;
  --ok: #5cc486; --bad: #ff7a70; --focus: #f29a48; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); padding-inline: 16px; padding-block: 12px 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; line-height: 1.1; }
h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.86em; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 4px 12px; border-bottom: 1px solid var(--rule); }
header.top .sub { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
.modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.modes button { font: 600 0.95rem var(--display); letter-spacing: 0.04em; text-transform: uppercase; padding: 8px 16px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.modes button:focus-visible, .tool:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); font-size: 0.88rem; }
.chip b { font-family: var(--mono); font-weight: 500; }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 14px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.map { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; height: min(78vh, 760px); min-height: 380px; overflow: hidden; }
.map svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.map svg.dragging { cursor: grabbing; }
.toolbar { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; }
.tool { width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 4px; font: 600 1.1rem var(--mono); cursor: pointer; }
.readout { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; pointer-events: none; }
.scalebar { font: 0.75rem var(--mono); color: var(--ink); }
.scalebar .bar { height: 6px; border: 1px solid var(--ink); border-top: 0; background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
.coords { font: 0.75rem var(--mono); color: var(--muted); background: var(--sheet); padding: 2px 6px; border: 1px solid var(--rule); border-radius: 3px; }
.north { position: absolute; top: 10px; right: 12px; width: 34px; text-align: center; font: 600 0.85rem var(--display); color: var(--ink); pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 0.82rem; padding: 6px 8px; border-radius: 4px; max-width: 260px; line-height: 1.35; }
.tip .k { opacity: 0.7; }
aside { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
aside section { display: flex; flex-direction: column; gap: 8px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.legend label { display: grid; grid-template-columns: 18px 22px 1fr auto; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.legend .sw { width: 22px; height: 14px; border-radius: 2px; }
.legend .n { color: var(--muted); font: 0.8rem var(--mono); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select { font: inherit; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 0.78rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.r, th.r { text-align: right; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.checks .mark { font-family: var(--mono); }
.checks .ok .mark { color: var(--ok); }
.checks .bad .mark { color: var(--bad); }
.checks .d { color: var(--muted); font-size: 0.82rem; }
.detail { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; min-height: 64px; font-size: 0.88rem; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; font-family: var(--mono); font-size: 0.85em; }
.note { color: var(--muted); font-size: 0.84rem; }
.scale-key { display: flex; align-items: center; gap: 6px; font: 0.78rem var(--mono); color: var(--muted); }
.scale-key .ramp { flex: 1; height: 8px; border-radius: 2px; }
.tablewrap { overflow-x: auto; }
/* map layers, all coloured from the tokens */
.L-boundary { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.L-grid { fill: url(#grid); }
.L-placement_zone { fill: var(--placement); fill-opacity: 0.07; stroke: var(--placement); stroke-dasharray: 6 4; stroke-width: 1.4; }
.L-door_zone_max { fill: none; stroke: var(--zone-max); stroke-dasharray: 3 3; stroke-width: 1.2; }
.L-door_zone { fill: var(--zone); fill-opacity: 0.2; stroke: var(--zone); stroke-width: 1.4; }
.L-corridor { fill: var(--corridor); fill-opacity: 0.32; stroke: var(--corridor); stroke-width: 1; }
.L-prohibited { fill: url(#hatch-red); stroke: var(--prohibited); stroke-width: 1.2; }
.L-obstacle { fill: url(#hatch-dark); stroke: var(--obstacle); stroke-width: 1.6; }
.L-door { fill: var(--door); stroke: var(--door); stroke-width: 2; }
.L-bed { stroke: var(--sheet); stroke-width: 0.8; }
.L-path { fill: none; stroke: var(--path); stroke-opacity: 0.28; stroke-width: 1; }
.L-path.hot { stroke: var(--focus); stroke-opacity: 1; stroke-width: 2.4; }
.L-bed.hot, .L-obstacle.hot, .L-door_zone.hot, .L-door.hot { stroke: var(--focus); stroke-width: 2.4; }
.label { font: 600 0.9px var(--display); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 0.18px; pointer-events: none; }
.hatch-dark line { stroke: var(--obstacle); stroke-width: 0.12; }
.hatch-red line { stroke: var(--prohibited); stroke-width: 0.1; }
.gridline { stroke: var(--grid); stroke-width: 0.03; }
.gridline5 { stroke: var(--rule); stroke-width: 0.06; }
@media (prefers-reduced-motion: no-preference) { .L-bed, .L-path { transition: stroke-width 120ms; } }
</style>

<header class="top">
  <div>
    <h1 id="camp-name">Camp site plan</h1>
    <div class="sub" id="camp-sub"></div>
  </div>
  <div class="modes" role="group" aria-label="What to show">
    <button type="button" id="mode-input" aria-pressed="false">Input</button>
    <button type="button" id="mode-output" aria-pressed="true">Optimised layout</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="layout">
  <div class="map" id="map">
    <svg id="svg" role="img" aria-label="Site plan of the camp">
      <defs>
        <pattern id="grid" patternUnits="userSpaceOnUse" width="5" height="5">
          <path class="gridline" d="M1 0V5M2 0V5M3 0V5M4 0V5M0 1H5M0 2H5M0 3H5M0 4H5" />
          <path class="gridline5" d="M0 0V5M0 0H5" />
        </pattern>
        <pattern id="hatch-dark" class="hatch-dark" patternUnits="userSpaceOnUse" width="0.5" height="0.5" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="0.5" />
        </pattern>
        <pattern id="hatch-red" class="hatch-red" patternUnits="userSpaceOnUse" width="0.7" height="0.7" patternTransform="rotate(-45)">
          <line x1="0" y1="0" x2="0" y2="0.7" />
        </pattern>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="toolbar">
      <button type="button" class="tool" id="zin" aria-label="Zoom in">+</button>
      <button type="button" class="tool" id="zout" aria-label="Zoom out">−</button>
      <button type="button" class="tool" id="zfit" aria-label="Fit the camp" title="Fit the camp">⤢</button>
    </div>
    <div class="north" aria-hidden="true">
      <svg viewBox="0 0 20 28" width="22" height="30"><path d="M10 2 L16 24 L10 19 L4 24 Z" fill="currentColor" /></svg>
      <div>N</div>
    </div>
    <div class="readout">
      <div class="scalebar" id="scalebar"><div class="bar" id="scalebar-bar"></div><span id="scalebar-text"></span></div>
      <div class="coords" id="coords">x — m, y — m</div>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <aside>
    <section aria-labelledby="h-layers">
      <h2 id="h-layers">Layers</h2>
      <ul class="legend" id="legend"></ul>
      <div class="row" id="colour-row">
        <label for="colour-by">Colour beds by</label>
        <select id="colour-by">
          <option value="type">bed type</option>
          <option value="door">assigned door</option>
          <option value="walk">walking distance</option>
        </select>
      </div>
      <div class="scale-key" id="walk-key" hidden><span id="walk-min">0 m</span><div class="ramp" id="walk-ramp"></div><span id="walk-max"></span></div>
    </section>
    <section aria-labelledby="h-detail">
      <h2 id="h-detail">Selected</h2>
      <div class="detail" id="detail"><span class="note">Point at or tap anything on the plan.</span></div>
    </section>
    <section aria-labelledby="h-doors">
      <h2 id="h-doors">Doors</h2>
      <div class="tablewrap"><table id="doors"></table></div>
    </section>
    <section aria-labelledby="h-stages">
      <h2 id="h-stages">Optimisation</h2>
      <div class="tablewrap"><table id="stages"></table></div>
      <p class="note" id="model-note"></p>
    </section>
    <section aria-labelledby="h-checks">
      <h2 id="h-checks">Independent validation</h2>
      <ul class="checks" id="checks"></ul>
    </section>
  </aside>
</div>

    try { localStorage.setItem("camp-mode", m); } catch (e) { /* storage may be unavailable */ }
    draw();
    select(null);
  }
  $("mode-input").addEventListener("click", () => setMode("input"));
  $("mode-output").addEventListener("click", () => setMode("output"));
  $("colour-by").addEventListener("change", draw);
  if (location.hash === "#input") mode = "input";
  else { try { mode = localStorage.getItem("camp-mode") || mode; } catch (e) { /* ignore */ } }
  setMode(mode);
  fit();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(draw, 0));
  new MutationObserver(() => setTimeout(draw, 0)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
